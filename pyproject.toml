[project]
name = "dev-agent"
version = "0.1.0"
description = "Arnés Global multi-agente para desarrollo asistido por IA sobre múltiples proyectos de software (agnóstico de stack)."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "output", ".chromadb"]

[tool.ruff.lint]
# Starter conservador: estilo (E), correctitud/imports sin uso (F), orden de imports (I).
# Sin UP/B por ahora para evitar reescrituras de sintaxis y falsos positivos con Typer.
select = ["E", "F", "I"]
ignore = ["E501"]        # la longitud la maneja el formatter; no fallar por líneas puntuales

[tool.pytest.ini_options]
pythonpath = ["."]        # permite `from config_loader import config` en los tests
testpaths = ["tests"]
addopts = "-q"